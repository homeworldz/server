[server]
address = 127.0.0.1:42000
public_url = http://127.0.0.1:42000

[grid]
name = Homeworldz

[client]
url = http://localhost:42000

[auth]
# Replace this before region registration is enabled.
service_token = change-me

# The browser-facing API, served by the separate homeworldz-api binary — the
# grid on 42000 does not serve /v1. The management site in web/ and the
# Homeworldz client both talk to this tier and nothing else.
[website]
address = 127.0.0.1:42010
# Absolute base this tier is reached at. Leave it unset and the grid channel's
# URL is published EMPTY, because it is derived from this by scheme swap
# (https to wss, http to ws) — a client then finds no channel to open.
public_url = http://127.0.0.1:42010
# Exact-match CORS allowlist. A browser origin missing here gets 403
# origin_forbidden on every call, so list each origin any browser serves your
# pages from. The management site's Vite dev server is fixed at 43220
# (web/vite.config.js); the marketing site's is 43210, in its own repository.
allowed_origins = http://127.0.0.1:43220,http://localhost:43220
# Signs website account tokens. Generate a long random value per deployment;
# an empty secret leaves this tier unable to issue or verify them.
jwt_secret = change-me


# Asset vault (ADR 0026): durable storage for the bytes behind every
# inventory-referenced asset, so a user's inventory survives the loss of any
# region. A relative path resolves against the working directory.
[vault]
path = var/vault
